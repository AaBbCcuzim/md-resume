name: CI/CD Pipeline

on:
  push:
    branches:
      - dev

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: 打包项目
    runs-on: ubuntu-latest
    steps:
      - name: 发现代码
        uses: actions/checkout@v6

      - name: 设置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: 下载项目依赖
        run: npm install

      - name: 构建项目
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifact
          path: dist

  deploy:
    name: 部署到 GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: dist-artifact
          path: dist

      - name: 使用 GitHub Pages Action 部署
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

  deploy-server:
    name: 部署到云服务器 (Docker Hub 模式)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: dist-artifact
          path: dist

      - name: 登录 Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          provenance: false
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:latest

      - name: 远程 SSH 指令拉取并运行
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            # Docker Hub 登录（重试 3 次）
            for i in 1 2 3; do
              echo "Docker login attempt $i..."
              echo "${{ secrets.DOCKERHUB_TOKEN }}" | sudo docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin && break
              echo "Login failed, retrying in 5s..."
              sleep 5
            done

            # 停止并删除旧容器
            sudo docker stop ${{ github.event.repository.name }} || true
            sudo docker rm ${{ github.event.repository.name }} || true

            # 拉取新镜像（重试 3 次）
            IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:latest"
            for i in 1 2 3; do
              echo "Docker pull attempt $i..."
              sudo docker pull "$IMAGE" && break
              echo "Pull failed, retrying in 10s..."
              sleep 10
            done

            # 运行新容器
            sudo docker run -d --name ${{ github.event.repository.name }} -p 8080:80 "$IMAGE"

name: CI/CD Pipeline

on:
  push:
    branches:
      - dev

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: 📦 打包项目
    runs-on: ubuntu-latest
    steps:
      - name: 🔍 发现代码
        uses: actions/checkout@v6

      - name: ⚙️ 设置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: 📥 下载项目依赖
        run: npm install

      - name: 🏗️ 构建项目
        run: npm run build

      - name: 📦 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifact
          path: dist

      - name: 📧 发送邮件
        uses: dawidd6/action-send-mail@v16
        with:
          server_address: smtp.qq.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: 项目构建成功通知
          body: |
            你好 ${{ github.actor }}，项目已成功构建并打包。

            提交信息: ${{ github.event.head_commit.message }}
            
            查看详情: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          to: ${{ github.event.pusher.email }}
          from: GitHub (${{ github.repository }}) <${{ secrets.EMAIL_USERNAME }}>

  deploy:
    name: 🚀 部署到 GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 📥 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: dist-artifact
          path: dist

      - name: 🚀 使用 GitHub Pages Action 部署
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
